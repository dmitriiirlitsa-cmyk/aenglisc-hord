# Публикация на Netlify: фронтенд собирается Vite в dist, запросы /api/chat обрабатывает
# функция netlify/functions/chat.mjs. Ключ GEMINI_API_KEY задаётся в настройках сайта на Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  # Сборка отменяется (и не тратит кредиты), если в коммите изменились только темы «Грамматики»
  # (content/) или картинки из админки (public/uploads/) — сайт читает их прямо с GitHub.
  # Ручной «Trigger deploy» того же коммита (CACHED_COMMIT_REF = COMMIT_REF) собирается всегда;
  # при любой ошибке git команда завершается не нулём — тоже сборка.
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)content' ':(exclude)public/uploads'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
