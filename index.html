<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÆNGLISC HORD</title>
    <meta name="description" content="Онлайн-словарь английского" />
    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <!-- Применяем тему до отрисовки, чтобы не было вспышки светлого фона -->
    <script>
      try {
        var t = localStorage.getItem('aenglisc.theme') || 'system';
        if (t === 'dark' || t === 'coffee' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        if (t === 'coffee') document.documentElement.classList.add('coffee');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
